# Merges upstream warpdotdev/warp master into this fork's main, builds WarpOss for macOS and Linux,
# pushes the merged main and publishes one release holding both platforms' artifacts.
#
# Job order: prepare -> macos and linux in parallel -> publish. The build jobs only upload
# artifacts. The publish job is the only one that pushes main or touches the release, and it runs
# when at least one platform built, so a failure on one platform does not block the other. A merge
# conflict stops the run in prepare, before anything is built or pushed. main therefore only ever
# points at a commit that has a release, and machines keep the previous release on failure.
# A platform missing from an existing release is built on the next run and added to that release.
name: WarpOss daily build

on:
  schedule:
    # 18:00 UTC is 02:00 in Asia/Shanghai; machines install the release at 07:00.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build both platforms even if the merged main already has them in a release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: warposs-daily
  cancel-in-progress: false

env:
  # Asset names are the contract with scripts/ai-tools/warp_oss_update.py in the libretto repository.
  MACOS_ASSET: WarpOss.zip

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      main: ${{ steps.pins.outputs.main }}
      upstream: ${{ steps.pins.outputs.upstream }}
      date: ${{ steps.pins.outputs.date }}
      head: ${{ steps.merge.outputs.head }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      release_exists: ${{ steps.plan.outputs.release_exists }}
      need_macos: ${{ steps.plan.outputs.need_macos }}
      need_linux: ${{ steps.plan.outputs.need_linux }}
    steps:
      # The two parents and the date are fixed here so that every later job rebuilds the same merge
      # commit even if upstream master or main moves while the builds run.
      - name: Pin merge inputs
        id: pins
        run: |
          echo "main=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git ls-remote https://github.com/warpdotdev/warp.git refs/heads/master | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out merge action
        uses: actions/checkout@v5
        with:
          path: ci
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Merge upstream master
        id: merge
        uses: ./ci/.github/actions/merge-upstream
        with:
          main: ${{ steps.pins.outputs.main }}
          upstream: ${{ steps.pins.outputs.upstream }}
          date: ${{ steps.pins.outputs.date }}

      # The Arch package version must increase with every build and cannot contain a hyphen, so it
      # is the build date plus the number of commits on the merged main.
      - name: Plan builds
        id: plan
        working-directory: warp
        env:
          HEAD: ${{ steps.merge.outputs.head }}
          DATE: ${{ steps.pins.outputs.date }}
          FORCE: ${{ inputs.force }}
        run: |
          short=${HEAD:0:9}
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
                  --jq '.[].tagName' | grep -- "-$short$" || true)
          assets=""
          if [[ -n "$tag" ]]; then
            assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            tag="warposs-$(date -u -d "@$DATE" +%Y%m%d)-$short"
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
          need() { [[ "$FORCE" == "true" ]] || ! grep -q -- "$1" <<< "$assets"; }
          need '^WarpOss\.zip$' && echo "need_macos=true" >> "$GITHUB_OUTPUT" || echo "need_macos=false" >> "$GITHUB_OUTPUT"
          need '\.pkg\.tar\.zst$' && echo "need_linux=true" >> "$GITHUB_OUTPUT" || echo "need_linux=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u -d "@$DATE" +%Y%m%d).$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    if: needs.prepare.outputs.need_macos == 'true'
    runs-on: macos-26
    timeout-minutes: 345
    env:
      SIGNING_IDENTITY: WarpOss Local Code Signing
      # Root certificate hash in the designated requirement; it must stay stable so macOS keeps
      # the permissions it granted to earlier builds.
      SIGNING_ROOT_SHA1: fb0d3d71554fa3f88f60a503366754b5dbdaa786
    steps:
      - name: Check out merge action
        uses: actions/checkout@v5
        with:
          path: ci
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Merge upstream master
        uses: ./ci/.github/actions/merge-upstream
        with:
          main: ${{ needs.prepare.outputs.main }}
          upstream: ${{ needs.prepare.outputs.upstream }}
          date: ${{ needs.prepare.outputs.date }}
          expected-head: ${{ needs.prepare.outputs.head }}

      # The embedded input classifier models are Git LFS objects. They come from upstream's LFS
      # storage so the daily build does not spend the fork's LFS bandwidth quota.
      - name: Fetch LFS models
        working-directory: warp
        run: |
          git lfs install --local
          git lfs fetch upstream --include="crates/input_classifier/models/**"
          git lfs checkout

      - name: Install toolchains
        working-directory: warp
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          # Installs the toolchain pinned by rust-toolchain.toml.
          rustup toolchain install
          brew install protobuf create-dmg
          script/install_cargo_bundle
          script/install_cargo_release_deps

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: warp
          key: warposs

      - name: Test patched behaviour
        working-directory: warp
        env:
          WARP_LOCAL_SKIP_METAL: "1"
        run: |
          cargo test -p warp --lib -- workspace:: uri::

      - name: Build WarpOss
        working-directory: warp
        run: ./script/macos/bundle --channel oss --nouniversal --nosign

      - name: Sign WarpOss
        working-directory: warp
        env:
          P12_BASE64: ${{ secrets.WARP_CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.WARP_CODESIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/warposs-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          app=target/release-lto/bundle/osx/WarpOss.app
          codesign --force --deep --options runtime --keychain "$keychain" --sign "$SIGNING_IDENTITY" \
            --entitlements script/Debug-Entitlements.plist "$app"
          codesign --verify --deep --strict "$app"
          codesign -d -r- "$app" 2>&1 | grep -q "certificate root = H\"$SIGNING_ROOT_SHA1\""
          security delete-keychain "$keychain"

      - name: Package WarpOss
        working-directory: warp/target/release-lto/bundle/osx
        run: |
          ditto -c -k --keepParent WarpOss.app "$MACOS_ASSET"
          shasum -a 256 "$MACOS_ASSET" > "$MACOS_ASSET.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: warposs-macos
          path: |
            warp/target/release-lto/bundle/osx/WarpOss.zip
            warp/target/release-lto/bundle/osx/WarpOss.zip.sha256
          if-no-files-found: error

  linux:
    needs: prepare
    if: needs.prepare.outputs.need_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      # The release build and its dependencies need more than the free space of a fresh runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out merge action
        uses: actions/checkout@v5
        with:
          path: ci
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Merge upstream master
        uses: ./ci/.github/actions/merge-upstream
        with:
          main: ${{ needs.prepare.outputs.main }}
          upstream: ${{ needs.prepare.outputs.upstream }}
          date: ${{ needs.prepare.outputs.date }}
          expected-head: ${{ needs.prepare.outputs.head }}

      - name: Fetch LFS models
        working-directory: warp
        run: |
          git lfs install --local
          git lfs fetch upstream --include="crates/input_classifier/models/**"
          git lfs checkout

      # Upstream's own Debian dependency installer, the Linux path it supports in CI.
      - name: Install toolchains
        working-directory: warp
        run: |
          script/linux/install_build_deps
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          # Installs the toolchain pinned by rust-toolchain.toml.
          rustup toolchain install
          # cargo-about generates the third-party license file that goes into the package.
          script/install_cargo_release_deps --no-build-deps

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: warp
          key: warposs-linux

      # No package format is requested here: the binary is built on Ubuntu, and the Arch package
      # is assembled in an Arch container, because makepkg only exists on Arch. The binary links
      # against Ubuntu's glibc, which is older than the glibc of any current Arch system.
      - name: Build WarpOss
        working-directory: warp
        run: script/linux/bundle --channel oss --packages ""

      - name: Package for Arch Linux
        working-directory: warp
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # makepkg refuses to run as root, so the container builds as a user with the runner's
          # uid, which keeps the files it writes under target/ removable by later steps.
          # Bundling runs cargo about, so the runner's Rust installation is mounted at the same
          # path; its binaries run on Arch because Arch's glibc is newer than Ubuntu's.
          docker run --rm -v "$PWD:/work" -w /work -e VERSION -e RUNNER_UID="$(id -u)" \
            -v "$HOME/.cargo:$HOME/.cargo" -v "$HOME/.rustup:$HOME/.rustup" -e HOST_HOME="$HOME" \
            archlinux:base-devel bash -euxc '
              pacman -Syu --noconfirm sudo
              useradd -m -u "$RUNNER_UID" builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              # bundle_arch archives the staged files with tar, which would record the builder
              # uid as their owner, and that uid belongs to no user on the machines that install
              # the package. A tar wrapper makes the archive, and so the package, owned by root. The options
              # follow the arguments because bundle_arch passes old-style mode letters first.
              printf "#!/bin/sh\nexec /usr/bin/tar \"\$@\" --owner=0 --group=0 --numeric-owner\n" \
                > /usr/local/bin/tar
              chmod +x /usr/local/bin/tar
              # bundle_arch passes --noconfirm to makepkg when it sees GITHUB_ACTIONS; its
              # GITHUB_OUTPUT writes are discarded.
              sudo -u builder env GITHUB_ACTIONS=true GITHUB_OUTPUT=/dev/null \
                CARGO_HOME="$HOST_HOME/.cargo" RUSTUP_HOME="$HOST_HOME/.rustup" \
                PATH="$HOST_HOME/.cargo/bin:$PATH" \
                SETTINGS_SCHEMA_SOURCE=/work/target/release-lto/settings_schema.json \
                script/linux/bundle --skip-build --channel oss --packages arch --release-tag "$VERSION"
            '
          cd target/release-lto/bundle/linux
          ls -l
          package=$(ls warp-terminal-oss-*.pkg.tar.zst)
          # Fail the build if any packaged file is not owned by root.
          ! tar --zstd -tvf "$package" | awk '$2 != "root/root"' | grep -q .
          sha256sum "$package" > "$package.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: warposs-linux
          path: |
            warp/target/release-lto/bundle/linux/warp-terminal-oss-*.pkg.tar.zst
            warp/target/release-lto/bundle/linux/warp-terminal-oss-*.pkg.tar.zst.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, macos, linux]
    # always() lets this job run when one platform failed or was skipped; it still requires the
    # other platform to have produced artifacts.
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.macos.result == 'success' || needs.linux.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out merge action
        uses: actions/checkout@v5
        with:
          path: ci
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Merge upstream master
        uses: ./ci/.github/actions/merge-upstream
        with:
          main: ${{ needs.prepare.outputs.main }}
          upstream: ${{ needs.prepare.outputs.upstream }}
          date: ${{ needs.prepare.outputs.date }}
          expected-head: ${{ needs.prepare.outputs.head }}

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: warposs-*
          path: artifacts
          merge-multiple: true

      # Merging upstream brings in upstream's workflow file changes, which GITHUB_TOKEN may never
      # push, so the merged main is pushed with the fine-grained sync token. LFS objects stay in
      # upstream's storage; the fork does not need copies of them.
      - name: Push merged main
        if: needs.prepare.outputs.head != needs.prepare.outputs.main
        working-directory: warp
        env:
          SYNC_TOKEN: ${{ secrets.WARPOSS_SYNC_TOKEN }}
          GIT_LFS_SKIP_PUSH: "1"
        run: |
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Publish release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          HEAD: ${{ needs.prepare.outputs.head }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          RELEASE_EXISTS: ${{ needs.prepare.outputs.release_exists }}
        run: |
          ls -l artifacts
          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --target main \
              --title "WarpOss $TAG" \
              --notes "Built from main@$HEAD, which merges warpdotdev/warp@$UPSTREAM."
          fi
